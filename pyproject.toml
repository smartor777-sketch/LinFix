[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netfix-linux"
version = "0.1.0"
description = "NetFix for Linux: управление zapret + TgWsProxy"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "NetFix Linux" }]
dependencies = [
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
netfix = "netfix.cli:main"
netfix-helper = "netfix.helper:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
netfix = ["py.typed"]
