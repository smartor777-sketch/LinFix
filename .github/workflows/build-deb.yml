name: build-deb

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Зависимости GTK для тестов
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-gi gir1.2-gtk-3.0 \
            gir1.2-ayatanaappindicator3-0.1 xvfb

      - name: Тесты
        run: xvfb-run -a python3 -m unittest discover -s tests -t .

      - name: Собрать .deb
        run: sh packaging/build_deb.sh

      - name: Загрузить артефакт
        uses: actions/upload-artifact@v4
        with:
          name: linfix-deb
          path: dist/*.deb
          if-no-files-found: error

      - name: Прикрепить .deb к релизу (по тегу)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.deb
          generate_release_notes: true
